name: E2E (live)

# Runs the Playwright browser smoke suite against a live deployment: daily on a
# schedule, and on demand from the Actions tab (optionally against another URL,
# e.g. a preview deploy). Only exercises signed-out public flows, so it needs no
# secrets or test accounts.

on:
  workflow_dispatch:
    inputs:
      url:
        description: Base URL to test
        required: false
        default: https://www.socratutoring.com
  schedule:
    - cron: '0 8 * * *' # daily at 08:00 UTC

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E against the live environment
        run: npx playwright test
        env:
          E2E_BASE_URL: ${{ github.event.inputs.url || 'https://www.socratutoring.com' }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
