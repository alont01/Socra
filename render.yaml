services:
  - type: web
    name: socra
    runtime: node
    plan: starter
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      # Core
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      # NextAuth (OAuth) — AUTH_SECRET also signs answer tokens (lib/answer-token.ts)
      - key: AUTH_SECRET
        sync: false
      - key: AUTH_URL
        sync: false
      - key: AUTH_GOOGLE_ID
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false
      - key: AUTH_GITHUB_ID
        sync: false
      - key: AUTH_GITHUB_SECRET
        sync: false
      # Video / transcription (core feature — app degrades heavily without it)
      - key: DAILY_API_KEY
        sync: false
      # Password-reset emails (without it, reset links are only logged, not sent)
      - key: RESEND_API_KEY
        sync: false
      # Admin system-health dashboard allowlist (comma-separated emails)
      - key: ADMIN_EMAILS
        sync: false
      # Monthly billing (/admin/billing) — without it, hours still track but
      # invoices can't be sent
      - key: STRIPE_SECRET_KEY
        sync: false
      # Flat hourly rate charged to every family (whole dollars, defaults to 75)
      - key: HOURLY_RATE_USD
        sync: false
      # Stripe webhook signing secret — without it, invoices never move to
      # "paid" and payment tracking silently stops working
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Shared secret for scheduled jobs (stale-session sweeper). Must match the
      # CRON_SECRET repository secret in GitHub Actions.
      - key: CRON_SECRET
        sync: false
